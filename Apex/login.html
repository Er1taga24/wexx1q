<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Вход — Apex Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Instrument+Sans:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="bg-fixed">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
</div>

<header class="topbar">
    <div class="left">
        <div class="logo"><img src="/images/logo.png" alt="Apex"></div>
        <span class="brand">Apex</span>
        <span class="sep">/</span>
        <span class="location">Вход</span>
    </div>
    <div class="center">
        <a href="/"><i class="fas fa-home"></i> Главная</a>
        <a href="/shop.html"><i class="fas fa-store"></i> Магазин</a>
        <a href="/rules.html"><i class="fas fa-gavel"></i> Правила</a>
        <a href="/privacy.html"><i class="fas fa-shield-alt"></i> Соглашение</a>
        <a href="/support.html"><i class="fas fa-headset"></i> Поддержка</a>
    </div>
    <div class="right">
        <a href="/login.html" class="btn-auth login active"><i class="fas fa-sign-in-alt"></i> Войти</a>
        <a href="/register.html" class="btn-auth register"><i class="fas fa-user-plus"></i> Регистрация</a>
    </div>
</header>

<div class="auth-page">
    <div class="auth-card">
        <div class="icon"><i class="fas fa-user-circle"></i></div>
        <h1>Добро пожаловать</h1>
        <p class="subtitle">Войдите в свой аккаунт</p>

        
        <form method="POST" id="loginForm">
            <div class="form-group">
                <label>Логин или Email</label>
                <input type="text" name="login" placeholder="Введите логин или email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required>
            </div>
            
            <!-- ВИДИМАЯ КАПЧА с галочкой -->
            <div class="captcha-wrap">
                <div class="g-recaptcha" data-sitekey="6LduqVEtAAAAANqxfO792YpBu5F2OxL-EwIQu7cb"></div>
            </div>
            
            <button type="submit" class="btn-submit"><i class="fas fa-arrow-right"></i> Войти</button>
        </form>

        <div class="auth-footer">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        var response = grecaptcha.getResponse();
        if (response.length === 0) {
            e.preventDefault();
            alert('Пожалуйста, подтвердите что вы не робот');
            return false;
        }
    });
</script>
<script src="js/common.js"></script>

</body>
</html>
